[gcode_shell_command hello_world]
command: echo hello world
timeout: 2.
verbose: True
[gcode_macro HELLO_WORLD]
gcode:
    RUN_SHELL_COMMAND CMD=hello_world

# --- camera watchdog ------------------------------------------------------
# Restarts crowsnest if /webcam/ stops answering. The loop itself lives
# outside Klipper (setsid) and reports to printer_data/logs/camera_watchdog.log
[gcode_shell_command camera_watchdog_start]
command: bash -c "setsid bash /home/theberrymancan/printer_data/config/camera_watchdog.sh start </dev/null >/dev/null 2>&1 &"
timeout: 20.
verbose: True

[gcode_shell_command camera_watchdog_stop]
command: bash /home/theberrymancan/printer_data/config/camera_watchdog.sh stop
timeout: 15.
verbose: True

[gcode_shell_command camera_watchdog_status]
command: bash /home/theberrymancan/printer_data/config/camera_watchdog.sh status
timeout: 15.
verbose: True

[gcode_macro CAMERA_WATCHDOG_START]
description: Start the webcam watchdog background loop
gcode:
    RUN_SHELL_COMMAND CMD=camera_watchdog_start

[gcode_macro CAMERA_WATCHDOG_STOP]
description: Stop the webcam watchdog background loop
gcode:
    RUN_SHELL_COMMAND CMD=camera_watchdog_stop

[gcode_macro CAMERA_WATCHDOG_STATUS]
description: Report watchdog state and recent log lines
gcode:
    RUN_SHELL_COMMAND CMD=camera_watchdog_status

# Start the watchdog 30s after every Klipper start / config reload.
[delayed_gcode CAMERA_WATCHDOG_BOOT]
initial_duration: 30.
gcode:
    CAMERA_WATCHDOG_START
