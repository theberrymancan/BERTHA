#####################################################################
#########################  Homing Override  #########################
#####################################################################

[homing_override]
axes: z                                # Only override Z homing; allow G28 X Y to home normally
set_position_z: 0                      # Set the Z position to 0 after homing
gcode:
    G90                                # Set to absolute positioning mode
    G0 Z10 F1200                       # Move Z axis to 10mm above the bed at 1200 mm/min
    G28 X                              # Home X axis
    G1 X250 F7200                      # Move X to clear umbilical from lights before homing
    G28 Y                              # Home Y axis
    G1 X170.5 Y177.5 F7200             # Move to a specific coordinate (175, 175) at 7200 mm/min
    G28 Z                              # Home Z axis
    

#####################################################################
##########################  Z Tilt Adjustment  ######################
#####################################################################

[z_tilt]
##  Use Z_TILT_ADJUST to level the bed.
##  z_positions: Location of toolhead
z_positions:
   -50, 18
   175, 398
   400, 18
points:
   50, 50
   175, 300
   300, 50

#--------------------------------------------------------------------#

speed: 350                                   # Speed of Z tilt adjustment
horizontal_move_z: 2                         # Z axis move speed for adjustments
retries: 10                                  # Number of retries for adjustment points
retry_tolerance: 0.0075                      # Retry tolerance for adjustment accuracy

#--------------------------------------------------------------------#

[gcode_macro Z_TILT_ADJUST]                                    # IDM/Cartographer optimized 3Z leveling macro
rename_existing: _Z_TILT_ADJUST
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT                         # Save current state for Z tilt adjustment
    BED_MESH_CLEAR                                             # Clear bed mesh
    {% if not printer.z_tilt.applied %}
      _Z_TILT_ADJUST horizontal_move_z=10 retry_tolerance=1    # Adjust Z tilt with higher tolerance initially
    {% endif %}
    _Z_TILT_ADJUST horizontal_move_z=2                         # Fine-tune Z tilt adjustment
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT                      # Restore saved state after adjustment
    CENTER                                                     # Move toolhead to center of build plate.


######################################################################
#########################  Convenience Macros  #######################
######################################################################

[gcode_macro PID_CALIBRATE_HOTEND]
description: Hotend Pid Calibrate
gcode:
  {% if printer.print_stats.state != "printing" %}
    PID_CALIBRATE HEATER=extruder TARGET={params.HOTEND_TEMP|default(230)}
  {% else %}
    RESPOND TYPE=error MSG='Not available while printing'
  {% endif %}

#--------------------------------------------------------------------#

[gcode_macro PID_CALIBRATE_BED]
description: Bed Pid Calibrate
gcode:
  {% if printer.print_stats.state != "printing" %}
    PID_CALIBRATE HEATER=heater_bed TARGET={params.BED_TEMP|default(65)}
  {% else %}
    RESPOND TYPE=error MSG='Not available while printing'
  {% endif %}

#--------------------------------------------------------------------#

[gcode_macro CENTER]
description: Defines a G-code macro for centering the toolhead.
gcode:
    G90                                                                                 # Set absolute positioning.
    G0 X170.5 Y177.5 Z30 F18000                                                         # Fast move to center position 30mm above bed.

#--------------------------------------------------------------------#

[gcode_macro QUICK_NOZZLE_BRUSH]
description: for quick cleaning from the home screen, centers toolhead after brushing.
gcode:
   SAVE_GCODE_STATE NAME=quick_nozzle_brush
   G90
   G1 X98 F18000
   G1 Y355 F18000
   G1 X80 F18000
   G1 X116 F18000
   G1 X80 F18000
   G1 X116 F18000
   G1 X80 F18000
   G1 X116 F18000
   G1 X80 F18000
   G1 X116 F18000
   CENTER
   RESTORE_GCODE_STATE NAME=quick_nozzle_brush

#--------------------------------------------------------------------#

[shaketune]
result_folder: ~/printer_data/config/ShakeTune
number_of_results_to_keep: 10
keep_raw_data: False
show_macros_in_webui: True
timeout: 600
measurements_chunk_size: 10
max_freq: 200
dpi: 300
    

# #####################################################################
# ######################  Probe Calibration Macro  ####################
# #####################################################################

[gcode_macro TOUCH_CALIBRATE]
# Defines a G-code macro for probe calibration
gcode:
    G28                                             # Home all axes
    G0 X175 Y175 Z1 F3600                           # Fast move to X150 Y150 Z1 at 3600 mm/min
    CARTOGRAPHER_TOUCH_CALIBRATE                    # Start probe calibration
    

# #####################################################################
# ##########  Bed Leveling Height and Calibration Macro  ##############
# #####################################################################

[gcode_macro G32]
# Defines a G-code macro for bed leveling and height calibration
gcode:
    BED_MESH_CLEAR                                     # Clear bed mesh
    G28                                                # Home all axes
    Z_TILT_ADJUST                                      # Perform gantry leveling
    G28                                                # Home all axes
    G0 X175 Y175 Z30 F3600                             # Fast move to center position 30mm above bed

#--------------------------------------------------------------------#

[gcode_macro DRAW_LINES]
gcode:
    G90                                                 # Absolute positioning
    # G92 E0                                            # Reset Extruder (commented out for now)
    # G1 Z5.0  F7200                                    # Move Z Axis up (commented out for now)
    G1 X50  Y0         F7200                            # Move to start position
    M83                                                 # Set extruder to relative mode
    G1 E15 F400                                         # Extrude filament
    G1 Z0.28 F7200                                      # Lower Z axis
    G1 X200 Y0   Z0.28 F1200 E17                        # Draw the first line
    G1 X200 Y0.4 Z0.28 F2400                            # Move to side a little
    G1 X55  Y0.4 Z0.28 F1200 E34                        # Draw the second line
    G92 E0                                              # Reset Extruder
    G90                                                 # Return to absolute positioning


# #####################################################################
# ####################  Print_Start and End Macros  ###################
# #####################################################################

[gcode_macro PRINT_START]
gcode:

  UPDATE_DELAYED_GCODE ID=maintain_chamber_temp DURATION=0                       # Cancels delayed gcode shutdown left over from previous print.

  {% set target_bed = params.BED|int %}                                          # Target bed temperature.
  {% set target_extruder = params.EXTRUDER|int %}                                # Target nozzle temperature.
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}                   # Bed center X.
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}                   # Bed center Y.
  {% set initial_tool = params.TOOL|default("0")|int %}                          # Checks that correct initial color is loaded.

                                                                                 # The following section is used to automate the required chamber temp per filament.
  
  {% set filament_type = params.FILAMENT|default("ASA")|string %}
    {% if filament_type == "PLA" or filament_type == "TPU" or filament_type == "PETG" %}
        {% set target_chamber = 0 %}
    {% elif filament_type == "PET" %}
        {% set target_chamber = 65 %}
    {% elif filament_type == "ABS" %}
        {% set target_chamber = 65 %}
    {% elif filament_type == "ASA" %}
        {% set target_chamber = 65 %}
    {% elif filament_type == "PA" %}
        {% set target_chamber = 75 %}
    {% elif filament_type == "PC" %}
        {% set target_chamber = 75 %}
    {% elif filament_type == "PPS" %}
        {% set target_chamber = 80 %}
  {% else %}
        {% set target_chamber = 65 %}  
  {% endif %}

  M104 S150                                                     # Preheat nozzle to 150C to avoid oozing before z-offset adjustment.
  M107                                                          # Initiate fan control.
  SET_FAN_SPEED FAN=FILTER_FANS SPEED=0.5                       # Set filter fan to 50%.
  M106 S0                                                       # Set part cooling fans to 0%.

  SET_GCODE_OFFSET Z=0                                          # Reset Z offset.
  G28                                                           # Home all axes.
  G90                                                           # Set to absolute positioning.

  SET_DISPLAY_TEXT MSG="Heating Bed: {target_bed}°C"            # Display bed heating message.
  G1 X{x_wait} Y{y_wait} Z15 F9000                              # Move to bed center.
  M190 S{target_bed}                                            # Wait for bed to reach target temperature.

                                                                # This section controls the bed fans in order to maintain appropriate 
                                                                # chamber temp, outlined in the filament section above.
  {% if target_chamber > 0 %}
  SET_DISPLAY_TEXT MSG="Heatsoaking Chamber to {target_chamber}°C..."
  SET_TEMPERATURE_FAN_TARGET temperature_fan=BED_FANS target={target_chamber}
  TEMPERATURE_WAIT SENSOR="temperature_fan BED_FANS" MINIMUM={target_chamber -5}
  {% else %}
  SET_TEMPERATURE_FAN_TARGET temperature_fan=BED_FANS target=0
  {% endif %}

  SET_DISPLAY_TEXT MSG="Tramming..."                            # Display tramming message.
  Z_TILT_ADJUST                                                 # Perform Z tilt adjustment.
  G28 Z                                                         # Re-home Z after adjustment.

  SET_DISPLAY_TEXT MSG="Bed Mesh Calibration..."                # Display mesh calibration message.
  BED_MESH_CALIBRATE                                            # Perform bed mesh calibration (KAMP).

  SET_DISPLAY_TEXT MSG="Calibrating Z Offset..."                # Display Z offset calibration message.
  AFC_BRUSH                                                     # Clear debris from nozzle before nozzle offset calibration.
  CARTOGRAPHER_TOUCH_HOME                                       # Calibrate Z offset.

  SET_DISPLAY_TEXT MSG="Loading Requested Lane..."              # Display Lane Load message.

                                                                # Determine whether the requested tool's lane is ALREADY loaded before
                                                                # calling T{n}; AFC skips heating and purging when no tool change is needed.
  
  {% set loaded_lane = printer["AFC_extruder " ~ printer.toolhead.extruder].lane_loaded %}
  {% set already_loaded = loaded_lane is not none and loaded_lane != "" and printer["AFC_stepper " ~ loaded_lane].map == ("T" ~ initial_tool) %}

  T{initial_tool}                                               # Load Initial Tool/Lane/Color if not already loaded.
  M109 S{target_extruder}                                       # Guarantee hotend is at print temp even if the lane was already loaded.
  {% if already_loaded %}
  GOOSE_PURGE EXTRUDER=extruder                                 # Prime when no tool change occurred (matches the load-path purge).
  {% endif %}

  SET_DISPLAY_TEXT MSG="Status Report: All Systems Are Go."     # Display preparation message.
  SKEW_PROFILE LOAD=BERTHA_skew_profile	                        # Loads skew profile right before printing begins. 

#----------------------------------------------------------------------------------------------------------------#

[delayed_gcode maintain_chamber_temp]
gcode:
   {% if printer.print_stats.state in ('printing', 'paused') %}                           # Safety net: never cut heaters during an active or paused print.
        UPDATE_DELAYED_GCODE ID=maintain_chamber_temp DURATION=60                         # 60s is the re-check interval, NOT the 1-hour hold started in PRINT_END.
    {% else %}
        RESPOND MSG="Cool-down period reached. Turning off heaters and fans."             # Sends text to the console/debugging log.
        M140 S0                                                                           # Turns off bed heater.
        M104 S0                                                                           # Turns off hotend heater.
        M106 S0                                                                           # Turns off part cooling fan.
    {% endif %}

#----------------------------------------------------------------------------------------------------------------#

[gcode_macro PRINT_END]
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 15, th.axis_maximum.z]|min %}
    {% set current_bed_target = printer.heater_bed.target %}

    SET_DISPLAY_TEXT MSG="Houston, Tranquility Base here. The Eagle has landed."        # Sets PRINT_END Display Message.
    RESPOND MSG="Keeping bed at {current_bed_target}C for the cool-down delay period."  # Sends text to the console/debugging log.
    M140 S{current_bed_target}                                                          # Locks bed temp at temp used during print. Useful for gradual cooldown and
                                                                                        # to maintain chamber temp while cycling prints.
    
    G90                                                                                 # Absolute positioning.
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000                                             # Move nozzle to remove stringing.
    TOOL_UNLOAD                                                                         # Unloads the currently active lane immediately at printing temperature.
    AFC_BRUSH                                                                           # Cleans nozzle before parking.
    G0 X230 Y330 F3600                                                                  # Move toolhead to safe parking spot to avoid collisions when homing next print.

    M104 S150                                                                           # Sets hotend heater to idle at 150C to maintain chamber temperature.
    M106 S0                                                                             # Set part cooling fans to 0%.
    M84 X Y Z E                                                                         # Disable stepper motors to avoid overheating the motors in hot chamber.
    UPDATE_DELAYED_GCODE ID=maintain_chamber_temp DURATION=3600                         # Sets timer for 1 hour and then proceeds to shut the heaters and part cooling fans off.
 
    M107                                                                                # Initiate fan control.
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=BED_FANS TARGET=0                       # Fans off for cool-down (target 0 overrides the reversed thermostat).
    SET_FAN_SPEED FAN=FILTER_FANS SPEED=0.5                                             # Set filter fan to 50%.
    M106 S0                                                                             # Set part cooling fans to 0%.
    SET_IDLE_TIMEOUT TIMEOUT=3600                                                       # Set timeout countdown to 1 hour.
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    RESET_AFC_MAPPING RUNOUT=no                                                         # Clears any tool remappings caused by infinite spool triggering.

    BED_MESH_CLEAR                                                                      # Clears bed mesh profile.
    SET_SKEW CLEAR=1                                                                    # Clears skew profile.

    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0                                     # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
                                                                                        # command pair is to restore the printer's coordinate system
                                                                                        # and speed settings since the commands above change them.
                                                                                        # However, to prevent any accidental, unintentional toolhead
                                                                                        # moves when restoring the state, explicitly set MOVE=0.
    
    
# #######################################################################
# ###################  Pause/Resume/Cancel Macros  ######################
# #######################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(10)|int %}                                                   # z hop amount

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              # set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    # set hotend temp variable for reference in resume macro

        SAVE_GCODE_STATE NAME=PAUSE                                                          # save current print position for resume
        BASE_PAUSE                                                                           # pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       # check that zhop doesn't exceed z max
            G91                                                                              # relative positioning
            G1 Z{z} F900                                                                     # raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  # if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                  # absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000   # park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      # save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        M104 S150                                                                              # turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                       # set timeout to 12 hours
    {% endif %}

#--------------------------------------------------------------------#

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}                                          # hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  # set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        # wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     # go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                          # relative positioning
        M83                                                                          # relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                # prime nozzle by E, lower Z back down
        {% else %}
            G1 Z{zhop * -1} F900                                                     # lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          # restore position
        BASE_RESUME                                                                  # resume print
    {% endif %}
  
#----------------------------------------------------------------------------------------------------------------#

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} ; set timeout back to configured value
    CLEAR_PAUSE
    PRINT_END
    BASE_CANCEL_PRINT

#----------------------------------------------------------------------------------------------------------------#

[gcode_macro M600]
gcode:
    PAUSE

