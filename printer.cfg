#####################################################################
#############################  Fans  ################################
#####################################################################

 ## Delta 2510 5V 15k RPM 3-Wire Axial Fan (Model# ASB02505SHA-AY6B)
 ## Running 24/7, non-switchable due to lack of available PWM pins on EBB36

[heater_fan hotend_fan]
pin: EBB36:PB4                    # Locked dummy control pin (DO NOT CHANGE)
max_power: 0.8
kick_start_time: 0.5
heater: extruder
heater_temp: -10.0                # Forces the monitoring loop wide open on boot
tachometer_pin: ^EBB36:PB3
tachometer_ppr: 2
tachometer_poll_interval: 0.0008

#--------------------------------------------------------------------#

## 2 - GDSTime 24v 4010 12k RPM Part Cooling Fans

[fan]
pin: EBB36: PA0
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.002
hardware_pwm: false
kick_start_time: 0.5

#--------------------------------------------------------------------#

## GDSTime 24v 3010 12k RPM EBB36 Cooling Fan

[temperature_fan EBB36_FAN]
pin: EBB36:PA1
max_power: 0.8
shutdown_speed: 0.0
kick_start_time: 0.5
sensor_type: temperature_combined
sensor_list: temperature_sensor EBB36
combination_method: max
maximum_deviation: 999.9
control: watermark 
max_delta: 3.0 
target_temp: 50.0 
min_temp: 0
max_temp: 85

#--------------------------------------------------------------------#

## Filter Fan - 2 Siboor 24v 5015 Blower Fans

[fan_generic FILTER_FANS]
pin: PD15
cycle_time: 0.00003
hardware_pwm: false
kick_start_time: 0.5

#--------------------------------------------------------------------#

## 4 - GDSTime 24v 5015 Blower Fans

[temperature_fan BED_FANS]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.1
sensor_type: Generic 3950
sensor_pin: PF4
control: watermark
reverse: True                                                           # Invert the thermostat: fans run while chamber is BELOW target and stop above it.
max_delta: 2.0                                                         # Hysteresis: on at target-2C, off at target+2C.
min_temp: 0
max_temp: 80
target_temp: 0.0                                                       # 0 = fans off after boot/restart until a macro sets a real target.
gcode_id: C



