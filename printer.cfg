#####################################################################
############################  INCLUDES  #############################
#####################################################################

[include fan_tach_monitor.cfg]
[include KAMP_Settings.cfg]
[include config_backup.cfg]
[include shell_command.cfg]
[include goose_belt.cfg]
[include AFC/*.cfg]

[pause_resume]
[display_status]
[exclude_object]
[firmware_retraction]
[skew_correction]

[gcode_arcs]
resolution: 0.1               

[force_move]
enable_force_move: true

[virtual_sdcard]
path: /home/theberrymancan/printer_data/gcodes
on_error_gcode: PAUSE_ON_ERROR

[gcode_macro PAUSE_ON_ERROR]
description: Pause instead of cancel when an SD-print G-code error occurs
gcode:
    PAUSE
    SET_IDLE_TIMEOUT TIMEOUT=43200
    UPDATE_DELAYED_GCODE ID=_REPORT_PRINT_ERROR DURATION=1

[delayed_gcode _REPORT_PRINT_ERROR]
gcode:
    {% set msg = printer.print_stats.message %}
    {% if msg %}
        {% set first = msg.splitlines()[0] %}
        RESPOND MSG="Print paused by G-code error: {first}"
    {% else %}
        RESPOND MSG="Print paused by a G-code error (see the !! line above)."
    {% endif %}


#####################################################################
############################  Kinematics  ###########################
#####################################################################

[printer]
kinematics: corexy
max_velocity: 900
max_accel: 50000
max_z_velocity: 50
max_z_accel: 100
minimum_cruise_ratio: 0.5
square_corner_velocity: 10


#####################################################################
#################  MCU (Octopus Pro v1.1 H723) Config  ##############
#####################################################################

[mcu]
canbus_uuid: d8d7bb5d4832
canbus_interface: can0


#####################################################################
#################  MCU Toolhead (EBB36 v1.2) Config  ################
#####################################################################

[mcu EBB36]
canbus_uuid: 1c49b2dd7186 


#####################################################################
##################   MCU Cartographer v4 (ADXL345)   ################
#####################################################################

[mcu CARTOGRAPHER]
canbus_uuid: efab0e0e567b

[cartographer]
mcu: CARTOGRAPHER
x_offset: 0
y_offset: 18
verbose: no

[adxl345]
cs_pin: CARTOGRAPHER:PA0
spi_bus: spi1
axes_map: y, -x, z

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20

[input_shaper]
shaper_type_x:mzv                  #max accel. 35,620 mm/s2    smoothing: 0.027   vibrations: 0.8%
shaper_freq_x: 110.4
damping_ratio_x: 0.052
shaper_type_y:mzv                  #max accel. 15,790 mm/s2    smoothing: 0.049   vibrations: 1.0%
shaper_freq_y: 73.6
damping_ratio_y: 0.025

[axis_twist_compensation]
reference_probe: cartographer_touch
mesh_min: 30, 30
mesh_max: 320, 290
probe_count: 5, 5
algorithm: bicubic
mesh_pps: 2, 2
speed: 50
horizontal_move_z: 10

[bed_mesh]
zero_reference_position: 175,175
speed: 200
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 320, 320
probe_count: 30, 30
algorithm: bicubic


#####################################################################
#######################  Temperature Monitoring  ####################
#####################################################################

[temperature_sensor Pi4B]
sensor_type: temperature_host
min_temp: 0
max_temp: 85

[temperature_sensor OCTOPUS]    
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 85

[temperature_sensor EBB36]
sensor_type: temperature_mcu
sensor_mcu: EBB36
min_temp: 0
max_temp: 85

[temperature_sensor CARTOGRAPHER]
sensor_type: temperature_mcu
sensor_mcu: CARTOGRAPHER
min_temp: 5
max_temp: 105


#####################################################################
#############################  Extruder  ############################
#####################################################################

# WWBMG (dual filament sensor) with Bondtech RIDGA Gearset
# and LDO-36STH20-1004AH(IG8T) 8T NEMA14 extruder motor

[extruder]
step_pin: EBB36: PD0
dir_pin: !EBB36: PD1
enable_pin: !EBB36: PD2
full_steps_per_rotation: 200
microsteps: 16
gear_ratio: 50:8
rotation_distance: 22.4224
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_velocity: 130
max_extrude_only_accel: 3000
max_extrude_only_distance: 400
max_extrude_cross_section: 50
heater_pin: EBB36: PB13
#control: pid
#pid_Kp: 24.328
#pid_Ki: 1.908
#pid_Kd: 77.543
min_temp: -20
max_temp: 350
min_extrude_temp: 180
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040
sensor_type:MAX31865
sensor_pin: EBB36: PA4
spi_bus: spi1
spi_speed: 500000
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_use_50Hz_filter: True
rtd_num_of_wires: 2
smooth_time: 2.0

[tmc2209 extruder]
uart_pin: EBB36: PA15
interpolate: true
run_current: 0.50
sense_resistor: 0.110
stealthchop_threshold: 0

[verify_heater extruder]
max_error: 120
check_gain_time: 120
hysteresis: 50
heating_gain: 2


