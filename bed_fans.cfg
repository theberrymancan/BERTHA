#--------------------------------------------------------------------#
#  Bed-fan chamber circulation  -  bed-temperature driven curve
#
#  Hardware: 4 x GDSTime 24v 5015 blowers under the bed (PD13) and the
#            PF4 chamber air sensor.
#
#  These blowers used to run as a plain reversed thermostat: as soon as
#  any chamber target was set they went straight to 100%, and on a cold
#  bed they pulled heat out of the bed faster than the bed heater could
#  put it in. That is what tripped [verify_heater heater_bed] ("not
#  heating at expected rate") during a preheat from cold.
#
#  Now the speed follows the BED temperature instead:
#    - cold bed   -> slow or no fans (the bed heater always wins)
#    - hot bed    -> full circulation (the chamber wins)
#    - while the bed is still climbing to its target the fans are held
#      at heating_cap, so they can never stall the bed heater
#    - once the chamber reaches the ceiling, the fans stop adding heat and
#      FILTER_FANS takes over as exhaust to bring the chamber back down
#
#  The loop owns the fan, but never fights you:
#    - it starts in "auto" and re-arms itself whenever the bed is set to
#      heat again, so any preheat drives the fans without extra commands
#    - if the speed is changed from outside (Mainsail slider, another
#      macro) the loop hands over to "manual" at that speed
#
#  Interface:
#    BED_FANS_CHAMBER TARGET=<C>    set the chamber ceiling by hand (console)
#    CHAMBER_PLA ... CHAMBER_PPS    one-click ceiling buttons, one per filament,
#    CHAMBER_NONE                   for the Mainsail dashboard / macro panel
#    BED_FANS_MANUAL SPEED=<0-1>    fixed speed, curve bypassed
#    BED_FANS_OFF                   fans off (cool-down / idle)
#    BED_FANS_STATUS                report mode, curve value, temps
#--------------------------------------------------------------------#

# Chamber air sensor (previously the BED_FANS thermostat sensor).
[temperature_sensor CHAMBER]
sensor_type: Generic 3950
sensor_pin: PF4
min_temp: 0
max_temp: 85                                                             # Hard cap on reported chamber temp; the EBB36 trip at 85C runs ~2C hotter, so it is the real backstop.
gcode_id: C                                                             # Reports as "C" in M105, as the old thermostat did.

# The blowers themselves - plain PWM, driven by the curve below.
[fan_generic BED_FANS]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.1
min_power: 0.06                                                         # Any nonzero speed is scaled into 0.06-1.0, so the blowers never sit in their stall band.

[gcode_macro _BED_FANS_VARS]
description: Tunables and state for the BED_FANS bed-temperature curve
gcode:
# mode: 0 = off, 1 = bed-temperature curve, 2 = manual fixed speed
# chamber_target: chamber ceiling for the current filament.
#                 -1 = none configured (curve runs unrestricted)
#                  0 = circulation forbidden for this filament (fans stay off)
#                 >0 = ceiling in C; the fans throttle down over chamber_taper
#                      degrees as the chamber approaches it, and stop at it
# chamber_taper: how many degrees below the ceiling the fans start backing off
# manual_speed: fan speed used when mode = 2
# heating_cap: maximum fan speed allowed while the bed is still below its target
# min_bed_target: with a requested bed temperature below this, the bed fans stay
#                 completely off (chamber exhaust assist still works)
# update_interval: seconds between curve updates
# last_speed: last speed the loop commanded (used to spot outside changes)
# curve_demand: last curve value computed (reported by BED_FANS_STATUS)
# curve: (bed temperature, fan speed) pairs, interpolated linearly between
#        points. Cold bed = slow fans, hot bed = full.
variable_mode: 1
variable_chamber_target: -1
variable_chamber_taper: 5
variable_manual_speed: 0
variable_heating_cap: 0.15
variable_min_bed_target: 80
variable_update_interval: 3
variable_last_speed: -1
variable_curve_demand: 0
variable_curve: [(45, 0.00), (60, 0.10), (70, 0.20), (80, 0.32), (90, 0.50), (100, 0.70), (110, 0.90), (115, 1.00)]
# Exhaust assist. The bed fans can only move bed heat into the chamber, they
# cannot take it out, so anything above the ceiling has to go out through
# FILTER_FANS. This only ever raises the exhaust above exhaust_restore, ramping
# from exhaust_start to exhaust_max over exhaust_ramp degrees above the ceiling,
# and hands back to exhaust_restore once the chamber is exhaust_stop under it.
variable_exhaust_on: False
variable_exhaust_max: 1.0
variable_exhaust_start: 0.5
variable_exhaust_ramp: 3
variable_exhaust_stop: 2
variable_exhaust_restore: 0.5

# Curve engine - runs continuously while Klipper is ready.
[delayed_gcode bed_fans_update]
initial_duration: 5
gcode:
    {% set v = printer["gcode_macro _BED_FANS_VARS"] %}
    {% set bed = printer["heater_bed"].temperature %}
    {% set bed_target = printer["heater_bed"].target %}
    {% set chamber = printer["temperature_sensor CHAMBER"].temperature %}
    {% set actual = printer["fan_generic BED_FANS"].speed %}
    {% set ns = namespace(mode=v.mode, speed=0.0, manual=v.manual_speed, demand=0.0) %}

    # Somebody else moved the fan (Mainsail slider, another macro): hand over.
    {% if v.last_speed >= 0 and (actual - v.last_speed)|abs > 0.05 %}
        {% set ns.mode = 2 %}
        {% set ns.manual = actual %}
    {% endif %}

    # Off is only sticky while the bed sits at temperature; a new heat-up re-arms.
    # Blocked when this filament forbids chamber circulation (chamber_target 0).
    {% if ns.mode == 0 and bed_target > 0 and bed < bed_target - 3 and v.chamber_target != 0 %}
        {% set ns.mode = 1 %}
    {% endif %}

    {% if ns.mode == 2 %}
        {% set ns.speed = ns.manual %}
    {% elif ns.mode == 1 and bed_target >= v.min_bed_target and v.chamber_target != 0 %}
        # Linear interpolation through the curve points.
        {% set ns.speed = v.curve[0][1] %}
        {% for i in range(v.curve|length - 1) %}
            {% if bed >= v.curve[i + 1][0] %}
                {% set ns.speed = v.curve[i + 1][1] %}
            {% elif bed > v.curve[i][0] %}
                {% set ns.speed = v.curve[i][1] + (v.curve[i + 1][1] - v.curve[i][1]) * (bed - v.curve[i][0]) / (v.curve[i + 1][0] - v.curve[i][0]) %}
            {% endif %}
        {% endfor %}
        {% set ns.demand = ns.speed %}
        {% if bed < bed_target - 3 and ns.speed > v.heating_cap %}
            {% set ns.speed = v.heating_cap %}
        {% endif %}
        # Chamber ceiling: throttle over the last chamber_taper degrees, stop at the ceiling.
        {% if v.chamber_target > 0 %}
            {% set room = v.chamber_target - chamber %}
            {% if room <= 0 %}
                {% set ns.speed = 0.0 %}
            {% elif room < v.chamber_taper %}
                {% set ns.speed = ns.speed * room / v.chamber_taper %}
            {% endif %}
        {% endif %}
    {% endif %}

    {% if ns.mode != v.mode %}
        SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=mode VALUE={ns.mode}
    {% endif %}
    {% if ns.manual != v.manual_speed %}
        SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=manual_speed VALUE={ns.manual}
    {% endif %}
    {% if (ns.demand - v.curve_demand)|abs > 0.005 %}
        SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=curve_demand VALUE={ns.demand|round(3)}
    {% endif %}
    {% if (ns.speed - v.last_speed)|abs > 0.001 %}
        SET_FAN_SPEED FAN=BED_FANS SPEED={ns.speed|round(3)}
        SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=last_speed VALUE={ns.speed|round(3)}
    {% endif %}

    # Exhaust assist for the chamber ceiling.
    {% set boost = false %}
    {% if v.chamber_target > 0 %}
        {% if v.exhaust_on %}
            {% if chamber - v.chamber_target > -v.exhaust_stop %}
                {% set boost = true %}
            {% endif %}
        {% elif chamber - v.chamber_target >= v.exhaust_start %}
            {% set boost = true %}
        {% endif %}
    {% endif %}
    {% if boost %}
        {% set factor = [[(chamber - v.chamber_target - v.exhaust_start) / v.exhaust_ramp, 0.0]|max, 1.0]|min %}
        {% set exhaust = v.exhaust_restore + (v.exhaust_max - v.exhaust_restore) * factor %}
        {% if (exhaust - printer['fan_generic FILTER_FANS'].speed)|abs > 0.02 %}
            SET_FAN_SPEED FAN=FILTER_FANS SPEED={exhaust|round(2)}
        {% endif %}
        {% if not v.exhaust_on %}
            SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=exhaust_on VALUE=True
        {% endif %}
    {% elif v.exhaust_on %}
        SET_FAN_SPEED FAN=FILTER_FANS SPEED={v.exhaust_restore}
        SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=exhaust_on VALUE=False
    {% endif %}
    UPDATE_DELAYED_GCODE ID=bed_fans_update DURATION={v.update_interval}

[gcode_macro BED_FANS_CHAMBER]
description: Set the per-filament chamber ceiling for the bed-fan curve (0 = no circulation)
gcode:
    {% set target = params.TARGET|default(-1)|float %}
    {% if target < 0 %}
        RESPOND MSG="BED_FANS: TARGET must be 0 (no circulation) or the chamber ceiling in C"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=chamber_target VALUE={target}
        SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=mode VALUE=1
        {% if target > 0 %}
            RESPOND MSG="BED_FANS: curve follows bed temp, chamber ceiling {target|int}C (throttles over the last {printer['gcode_macro _BED_FANS_VARS'].chamber_taper|int}C)"
        {% else %}
            RESPOND MSG="BED_FANS: chamber circulation disabled for this filament"
        {% endif %}
    {% endif %}

# One-click ceilings. Kalico does not publish macro descriptions/params to
# Mainsail, so a parameter dialog is not available - these fixed macros are the
# GUI route. Pin them to a Mainsail dashboard group and each filament is one tap.
# Klipper's gcode parser truncates a command at the first non-letter, so a macro
# name must be a single word: no '/' and no '-'. One word per filament it is.
[gcode_macro CHAMBER_PLA]
description: No chamber circulation for PLA (bed fans stay off)
gcode:
    BED_FANS_CHAMBER TARGET=0

[gcode_macro CHAMBER_PETG]
description: No chamber circulation for PETG (bed fans stay off)
gcode:
    BED_FANS_CHAMBER TARGET=0

[gcode_macro CHAMBER_TPU]
description: No chamber circulation for TPU (bed fans stay off)
gcode:
    BED_FANS_CHAMBER TARGET=0

[gcode_macro CHAMBER_PET]
description: Chamber ceiling 68C for PET (bed-fan curve)
gcode:
    BED_FANS_CHAMBER TARGET=68

[gcode_macro CHAMBER_ABS]
description: Chamber ceiling 68C for ABS (bed-fan curve)
gcode:
    BED_FANS_CHAMBER TARGET=68

[gcode_macro CHAMBER_ASA]
description: Chamber ceiling 68C for ASA (bed-fan curve)
gcode:
    BED_FANS_CHAMBER TARGET=68

[gcode_macro CHAMBER_PA]
description: Chamber ceiling 78C for PA (bed-fan curve)
gcode:
    BED_FANS_CHAMBER TARGET=78

[gcode_macro CHAMBER_PC]
description: Chamber ceiling 78C for PC (bed-fan curve)
gcode:
    BED_FANS_CHAMBER TARGET=78

[gcode_macro CHAMBER_PPS]
description: Chamber ceiling 75C for PPS (bed-fan curve)
gcode:
    BED_FANS_CHAMBER TARGET=75

[gcode_macro CHAMBER_NONE]
description: Clear the chamber ceiling - bed-fan curve unrestricted
gcode:
    SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=chamber_target VALUE=-1
    SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=mode VALUE=1
    RESPOND MSG="BED_FANS: chamber ceiling cleared (curve unrestricted)"

[gcode_macro BED_FANS_MANUAL]
description: Fixed BED_FANS speed, curve bypassed
gcode:
    {% set speed = params.SPEED|default(0)|float %}
    SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=manual_speed VALUE={speed}
    SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=mode VALUE=2
    SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=last_speed VALUE={speed}
    SET_FAN_SPEED FAN=BED_FANS SPEED={speed}
    RESPOND MSG="BED_FANS: manual speed {speed}"

[gcode_macro BED_FANS_OFF]
description: Turn the bed fans off (chamber ceiling is kept for the next heat-up)
gcode:
    SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=mode VALUE=0
    SET_GCODE_VARIABLE MACRO=_BED_FANS_VARS VARIABLE=last_speed VALUE=0
    SET_FAN_SPEED FAN=BED_FANS SPEED=0

[gcode_macro BED_FANS_STATUS]
description: Report bed-fan mode, curve value and current temperatures
gcode:
    {% set v = printer["gcode_macro _BED_FANS_VARS"] %}
    {% set bed = printer["heater_bed"].temperature %}
    {% set modes = ["off", "auto (bed-temp curve)", "manual"] %}
    {% if v.chamber_target < 0 %}
        {% set ceiling = "none" %}
    {% elif v.chamber_target == 0 %}
        {% set ceiling = "circulation disabled" %}
    {% else %}
        {% set ceiling = v.chamber_target|round(0)|string + "C (" + (v.chamber_target - printer['temperature_sensor CHAMBER'].temperature)|round(1)|string + "C headroom)" %}
    {% endif %}
    RESPOND MSG="BED_FANS: mode={modes[v.mode]} speed={printer['fan_generic BED_FANS'].speed} (curve wants {v.curve_demand|round(2)}) bed={bed|round(1)}C target={printer['heater_bed'].target|round(0)}C chamber={printer['temperature_sensor CHAMBER'].temperature|round(1)}C ceiling={ceiling} exhaust={printer['fan_generic FILTER_FANS'].speed}{' BOOST' if v.exhaust_on else ''}"
