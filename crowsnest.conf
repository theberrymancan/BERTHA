#### crowsnest.conf
#### This is the default config after installation.
#### It is also used as the default config in MainsailOS.
#### For details on how to configure this to your needs, see:
#### https://github.com/mainsail-crew/crowsnest/blob/v5/README.md


#####################################################################
####                                                            #####
####      Information about ports and according URL's           #####
####                                                            #####
#####################################################################
####                                                            #####
####    Port 8080 equals /webcam/?action=[stream/snapshot]      #####
####    Port 8081 equals /webcam2/?action=[stream/snapshot]     #####
####    Port 8082 equals /webcam3/?action=[stream/snapshot]     #####
####    Port 8083 equals /webcam4/?action=[stream/snapshot]     #####
####                                                            #####
####    Note: These ports are default for most Mainsail         #####
####    installations. Using a different port would involve     #####
####    changing the proxy configuration or using URLs          #####
####    with the specific port like                             #####
####    http://<ip>:<port>/?action=[stream/snapshot]            #####
####                                                            #####
#####################################################################


[crowsnest]
log_level: verbose                                                                # Valid Options are quiet/verbose/debug
rollover_on_start: false                                                          # Creates a backup and clears the log on every restart, if set to true
no_proxy: false                                                                   # If set to true, no reverse proxy is required. Only change this, if you know what you are doing.

[cam 1]
mode: ustreamer                        # ustreamer - Provides mjpg and snapshots. (All devices)
                                       # camera-streamer - Provides webrtc, mjpg and snapshots. (rpi + Raspi OS based only)
                                       # Switched from camera-streamer on 2026-11-11: its MJPEG stream
                                       # wedged and returned HTTP 500 until crowsnest was restarted.
port: 8080                             # HTTP/MJPG Stream/Snapshot Port
device: /dev/video0                    # See Log for available ...
resolution: 1280x720                   # widthxheight format (lowered from 1920x1080 to cut USB bandwidth)
max_fps: 20                            # If Hardware Supports this it will be forced, otherwise ignored/coerced.
#custom_flags:                         # You can run the Stream Services with custom flags.

v4l2ctl: vertical_flip=1,horizontal_flip=1                             # Add v4l2-ctl parameters to setup your camera, see Log what your cam is capable of.

#enable_rtsp: true                     # camera-streamer only, not supported by ustreamer
#rtsp_port: 8554                       # camera-streamer only, not supported by ustreamer
#flip_y: false                         # not supported by this build; rotation is handled by Moonraker/Mainsail
#flip_x: false                         # not supported by this build; rotation is handled by Moonraker/Mainsail
