   G1 X98 F18000
   G1 Y355 F18000
   G1 X80 F18000
   G1 X116 F18000
   G1 X80 F18000
   G1 X116 F18000
   G1 X80 F18000
   G1 X116 F18000
   G1 X80 F18000
   G1 X116 F18000
